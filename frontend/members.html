<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One-Kaizen Fitness — Member Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0B1224;
      --navy-900:#0B1224;
      --blue-700:#1D4ED8;
      --blue-600:#2563EB;
      --blue-400:#5B9BFF;
      --green:#16A34A;
      --amber:#B45309;
      --red:#DC2626;
      --sky-50:#F3F7FF;
      --sky-100:#E7F0FF;
      --slate-600:#5A6478;
      --slate-400:#8994A8;
      --line:#E4E9F2;
      --surface:#FFFFFF;
      --page:#F5F8FE;
    }

    *{box-sizing:border-box; margin:0; padding:0;}
    body{font-family:'Inter',sans-serif; background:var(--page); color:var(--ink); -webkit-font-smoothing:antialiased;}
    h1,h2,h3,h4{font-family:'Sora',sans-serif;}
    a{text-decoration:none; color:inherit;}
    input,select{font-family:'Inter',sans-serif;}

    .app{display:grid; grid-template-columns:264px 1fr; min-height:100vh;}

    #sidebar-root .sidebar,
    .sidebar{background:var(--navy-900); color:#fff; padding:24px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
    .sidebar::-webkit-scrollbar{display:none;}
    .side-logo{display:flex; align-items:center; gap:10px; padding:6px 10px 26px; font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px;}
    .side-logo .mark{width:34px; height:34px; border-radius:10px; flex-shrink:0; background:linear-gradient(145deg,var(--blue-600),#173B8F); display:flex; align-items:center; justify-content:center;}
    .side-logo .role{display:block; font-size:11px; font-weight:500; color:var(--blue-400); margin-top:1px;}
    .nav-group{margin-bottom:22px;}
    .nav-group h6{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#5C6D95; font-weight:600; padding:0 10px 10px;}
    .nav-item{display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px; font-size:14px; font-weight:500; color:#C6D0EA; margin-bottom:2px; cursor:pointer;}
    .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
    .nav-item.active{background:var(--blue-700); color:#fff;}
    .nav-badge{margin-left:auto; background:rgba(255,255,255,.14); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:100px;}
    .side-foot{margin-top:auto; display:flex; align-items:center; gap:10px; padding:18px 10px 0; border-top:1px solid rgba(255,255,255,.08);}
    .avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(145deg,var(--blue-400),var(--blue-700)); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:#fff;}
    .side-foot strong{display:block; font-size:13.5px;}
    .side-foot span{font-size:11.5px; color:#8FA0C7;}

    main{padding:26px 32px 60px; min-width:0;}
    .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:20px; flex-wrap:wrap;}
    .topbar h1{font-size:23px; font-weight:700;}
    .topbar .sub{font-size:13px; color:var(--slate-400); margin-top:2px;}
    .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .theme-btn{width:42px; height:42px; border-radius:11px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0;}
    .btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:11px; font-weight:600; font-size:14px; border:none; cursor:pointer; font-family:'Inter',sans-serif;}
    .btn-primary{background:var(--blue-700); color:#fff; box-shadow:0 12px 24px -12px rgba(29,78,216,.55);}
    .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line);}

    .summary{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
    .sum-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 20px;}
    .sum-card strong{display:block; font-family:'Sora',sans-serif; font-size:23px;}
    .sum-card span{font-size:12.5px; color:var(--slate-400);}

    .panel{background:var(--surface); border:1px solid var(--line); border-radius:18px;}
    .filters{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
    .search{display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:11px; padding:10px 14px; flex:1; min-width:220px; color:var(--slate-400);}
    .search input{border:none; outline:none; flex:1; font-size:13.5px; font-family:'Inter',sans-serif; color:var(--ink); background:transparent;}
    .f-group label{display:block; font-size:11px; font-weight:600; color:var(--slate-400); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
    .f-group select{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.5px; font-family:'Inter',sans-serif; color:var(--ink); background:var(--surface); outline:none; min-width:140px; cursor:pointer;}
    .chips{padding:12px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:50px;}
    .chip{display:inline-flex; align-items:center; gap:6px; background:var(--sky-100); color:var(--blue-700); font-size:12px; font-weight:600; padding:5px 10px; border-radius:100px;}
    .chip b{cursor:pointer; font-size:14px; line-height:1;}
    .result-count{font-size:12.5px; color:var(--slate-400); margin-left:auto;}
    .clear{font-size:12.5px; font-weight:600; color:var(--blue-700); cursor:pointer;}

    table{width:100%; border-collapse:collapse; min-width:860px;}
    th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--slate-400); font-weight:600; padding:14px 22px 12px;}
    td{padding:14px 22px; border-top:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
    tbody tr{cursor:pointer; transition:background .12s ease;}
    tbody tr:hover{background:var(--sky-50);}
    tbody tr.selected{background:var(--sky-100);}
    .m-cell{display:flex; align-items:center; gap:12px;}
    .m-avatar{width:36px; height:36px; border-radius:50%; background:var(--sky-100); color:var(--blue-700); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:12px; flex-shrink:0;}
    .m-cell strong{display:block; font-size:13.5px;}
    .m-cell span{font-size:12px; color:var(--slate-400);}
    .tag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; white-space:nowrap; display:inline-block;}
    .tag.active{background:#E7F8EE; color:var(--green);}
    .tag.expiring{background:#FFF6E5; color:var(--amber);}
    .tag.expired{background:#FDEDED; color:var(--red);}
    .tag.none{background:#EEF1F6; color:var(--slate-600);}
    .tag.student{background:var(--sky-100); color:var(--blue-700);}
    .muted{color:var(--slate-400); font-size:12.5px;}
    .empty{padding:60px 20px; text-align:center; color:var(--slate-400); font-size:14px; display:none;}

    .overlay{position:fixed; inset:0; background:rgba(11,18,36,.35); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40;}
    .overlay.open{opacity:1; pointer-events:auto;}
    .drawer{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:100%; background:var(--surface); z-index:50; transform:translateX(100%); transition:transform .25s ease; overflow-y:auto; box-shadow:-20px 0 50px -20px rgba(11,18,36,.3);}
    .drawer.open{transform:translateX(0);}
    .dr-head{padding:26px 28px 20px; border-bottom:1px solid var(--line); position:relative;}
    .dr-close{position:absolute; top:20px; right:22px; width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:18px; color:var(--slate-600);}
    .dr-profile{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
    .dr-avatar{width:56px; height:56px; border-radius:50%; background:linear-gradient(145deg,var(--blue-400),var(--blue-700)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:18px;}
    .dr-profile h3{font-size:18px;}
    .dr-profile p{font-size:12.5px; color:var(--slate-400); margin-top:2px;}
    .dr-tags{display:flex; gap:8px; flex-wrap:wrap;}
    .dr-section{padding:20px 28px; border-bottom:1px solid var(--line);}
    .dr-section h5{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate-400); margin-bottom:14px; font-family:'Inter',sans-serif; font-weight:600;}
    .dr-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px;}
    .dr-grid label{display:block; font-size:11.5px; color:var(--slate-400); margin-bottom:3px;}
    .dr-grid span{font-size:13.5px; font-weight:500;}
    .dr-grid .full{grid-column:1 / -1;}
    .pay-row{display:flex; justify-content:space-between; font-size:13px; padding:9px 0; border-top:1px solid var(--line);}
    .pay-row:first-of-type{border-top:none; padding-top:0;}
    .pay-row small{display:block; color:var(--slate-400); font-size:11.5px;}
    .dr-actions{padding:20px 28px; display:flex; gap:10px;}
    .dr-actions .btn{flex:1; justify-content:center;}
    html, body{scrollbar-width:none; -ms-overflow-style:none;}
    html::-webkit-scrollbar, body::-webkit-scrollbar, .drawer::-webkit-scrollbar{display:none;}
    .drawer{scrollbar-width:none; -ms-overflow-style:none;}

    @media(max-width:1100px){
      .app{grid-template-columns:1fr;}
      .sidebar{position:relative; top:auto; height:40vh; min-height:220px; max-height:360px; flex-direction:column; align-items:stretch; flex-wrap:nowrap; gap:0;}
      .nav-group{display:block;}
      .side-foot{margin-top:auto; margin-left:0;}
      .summary{grid-template-columns:repeat(2,1fr);}
    }
  </style>
</head>
<body data-page="members">
  <div class="app">
    <div id="sidebar-root"></div>

    <main>
      <div class="topbar">
        <div>
          <h1>Member Management</h1>
          <div class="sub">View, filter, and manage all gym clients</div>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" type="button">Export CSV</button>
          <button class="btn btn-primary" type="button">+ Add Member</button>
        </div>
      </div>

      <div class="summary">
        <div class="sum-card"><strong id="sTotal">0</strong><span>Total clients</span></div>
        <div class="sum-card"><strong id="sActive">0</strong><span>Active memberships</span></div>
        <div class="sum-card"><strong id="sExpiring">0</strong><span>Expiring within 30 days</span></div>
        <div class="sum-card"><strong id="sStudent">0</strong><span>Students</span></div>
      </div>

      <div class="panel">
        <div class="filters">
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="fSearch" type="text" placeholder="Search name, email, or contact number...">
          </div>
          <div class="f-group">
            <label>Sex</label>
            <select id="fSex"><option value="">All</option><option value="Male">M</option><option value="Female">F</option><option value="Other">O</option></select>
          </div>
          <div class="f-group">
            <label>Student</label>
            <select id="fStudent"><option value="">All</option><option value="yes">Student</option><option value="no">Non-student</option></select>
          </div>
          <div class="f-group">
            <label>Client type</label>
            <select id="fMember"><option value="">All</option><option value="yes">Member</option><option value="no">Non-member</option></select>
          </div>
          <div class="f-group">
            <label>Membership status</label>
            <select id="fStatus"><option value="">All</option><option value="active">Active</option><option value="expiring">Expiring soon</option><option value="expired">Expired</option><option value="none">No membership</option></select>
          </div>
          <div class="f-group">
            <label>Age</label>
            <select id="fAge"><option value="">All</option><option value="u18">Under 18</option><option value="18-25">18–25</option><option value="26-35">26–35</option><option value="36+">36+</option></select>
          </div>
        </div>

        <div class="chips" id="chips"></div>

        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr><th>Member</th><th>Sex / Age</th><th>Type</th><th>Membership</th><th>Expiry</th><th>Contact</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty" id="empty">No members match these filters.</div>
        </div>
      </div>
    </main>
  </div>

  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer">
    <div class="dr-head">
      <button class="dr-close" type="button" onclick="closeDrawer()">×</button>
      <div class="dr-profile">
        <div class="dr-avatar" id="dAvatar"></div>
        <div><h3 id="dName"></h3><p id="dId"></p></div>
      </div>
      <div class="dr-tags" id="dTags"></div>
    </div>
    <div class="dr-section">
      <h5>Personal details</h5>
      <div class="dr-grid">
        <div><label>Sex</label><br><span id="dSex"></span></div>
        <div><label>Age</label><br><span id="dAge"></span></div>
        <div><label>Birthdate</label><br><span id="dBirth"></span></div>
        <div><label>Contact</label><br><span id="dContact"></span></div>
        <div class="full"><label>Email</label><br><span id="dEmail"></span></div>
        <div class="full"><label>Address</label><br><span id="dAddress"></span></div>
      </div>
    </div>
    <div class="dr-section">
      <h5>Membership</h5>
      <div class="dr-grid">
        <div><label>Plan</label><br><span id="dPlan"></span></div>
        <div><label>Status</label><br><span id="dStatus"></span></div>
        <div><label>Start date</label><br><span id="dStart"></span></div>
        <div><label>Expiry date</label><br><span id="dExpiry"></span></div>
      </div>
    </div>
    <div class="dr-section">
      <h5>Recent payments</h5>
      <div id="dPayments"></div>
    </div>
    <div class="dr-section">
      <h5>Attendance</h5>
      <div class="dr-grid">
        <div><label>Last check-in</label><br><span id="dLast"></span></div>
        <div><label>Visits this month</label><br><span id="dVisits"></span></div>
      </div>
    </div>
    <div class="dr-actions">
      <button class="btn btn-ghost" type="button">Edit</button>
      <button class="btn btn-primary" type="button">Renew / New sale</button>
    </div>
  </aside>

  <script src="/components/sidebar.js"></script>

    var members = [

      {id:'OKF-0007', first:'Paolo', last:'Reyes', sex:'Male', age:27, birth:'1999-04-18', student:false, member:false, plan:'—', start:null, expiry:null, contact:'0919 332 6001', email:'paolo.r@email.com', address:'Brgy. Bagong Nayon, Baliwag, Bulacan', last_in:'Oct 8, 8:20 PM', visits:2, pays:[['Gym use – 1 session','Oct 8, 2026','₱160']]},
      {id:'OKF-0008', first:'Bea', last:'Fernandez', sex:'Female', age:19, birth:'2007-02-27', student:true, member:true, plan:'1 Year Student Membership', start:'2025-11-02', expiry:'2026-11-02', contact:'0945 118 9054', email:'bea.f@email.com', address:'Brgy. Makinabang, Baliwag, Bulacan', last_in:'Oct 7, 3:45 PM', visits:11, pays:[['Student membership','Nov 2, 2025','₱690']]},

      {id:'OKF-0010', first:'Trixie', last:'Gonzales', sex:'Female', age:25, birth:'2001-08-16', student:false, member:true, plan:'1 Year Membership', start:'2026-05-18', expiry:'2027-05-18', contact:'0977 640 1188', email:'trixie.g@email.com', address:'Brgy. Tangos, Baliwag, Bulacan', last_in:'Today, 9:10 AM', visits:17, pays:[['Membership','May 18, 2026','₱990'],['Boxing per session','Oct 2, 2026','₱370']]},
      {id:'OKF-0011', first:'Alex', last:'Cortez', sex:'Other', age:23, birth:'2003-06-22', student:true, member:false, plan:'—', start:null, expiry:null, contact:'0921 505 3399', email:'alex.c@email.com', address:'Brgy. Hinukay, Baliwag, Bulacan', last_in:'Oct 6, 5:30 PM', visits:3, pays:[['Gym use – weekly (student)','Oct 6, 2026','₱500']]},
      {id:'OKF-0012', first:'Dennis', last:'Ocampo', sex:'Male', age:34, birth:'1992-10-03', student:false, member:true, plan:'1 Year Membership', start:'2025-10-30', expiry:'2026-10-30', contact:'0933 782 4410', email:'dennis.o@email.com', address:'Brgy. Calantipay, Baliwag, Bulacan', last_in:'Oct 9, 6:50 AM', visits:16, pays:[['Membership','Oct 30, 2025','₱990']]}
    ];

    function statusOf(member){
      if(!member.expiry) return 'none';
      var diff = (new Date(member.expiry) - TODAY) / 86400000;
      if(diff < 0) return 'expired';
      if(diff <= 30) return 'expiring';
      return 'active';
    }

    function sx(v){ return v === 'Male' ? 'M' : v === 'Female' ? 'F' : 'O'; }
    function fmt(d){ return d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'; }
    function ageBand(a){ return a < 18 ? 'u18' : a <= 25 ? '18-25' : a <= 35 ? '26-35' : '36+'; }
    var statusLabel = {active:'Active', expiring:'Expiring soon', expired:'Expired', none:'No membership'};

    var fieldMap = {
      search: document.getElementById('fSearch'),
      sex: document.getElementById('fSex'),
      student: document.getElementById('fStudent'),
      member: document.getElementById('fMember'),
      status: document.getElementById('fStatus'),
      age: document.getElementById('fAge')
    };

    function filtered(){
      var q = fieldMap.search.value.trim().toLowerCase();
      return members.filter(function(member){
        if(q && (member.first + ' ' + member.last + ' ' + member.email + ' ' + member.contact + ' ' + member.id).toLowerCase().indexOf(q) === -1) return false;
        if(fieldMap.sex.value && member.sex !== fieldMap.sex.value) return false;
        if(fieldMap.student.value && (fieldMap.student.value === 'yes') !== member.student) return false;
        if(fieldMap.member.value && (fieldMap.member.value === 'yes') !== member.member) return false;
        if(fieldMap.status.value && statusOf(member) !== fieldMap.status.value) return false;
        if(fieldMap.age.value && ageBand(member.age) !== fieldMap.age.value) return false;
        return true;
      });
    }

    function renderSummary(){
      document.getElementById('sTotal').textContent = members.length;
      document.getElementById('sActive').textContent = members.filter(function(member){ return statusOf(member) === 'active' || statusOf(member) === 'expiring'; }).length;
      document.getElementById('sExpiring').textContent = members.filter(function(member){ return statusOf(member) === 'expiring'; }).length;
      document.getElementById('sStudent').textContent = members.filter(function(member){ return member.student; }).length;
    }

    function renderChips(count){
      var html = '';
      Object.keys(fieldMap).forEach(function(key){
        var element = fieldMap[key];
        if(key === 'search') {
          if(element.value) html += '<span class="chip">Search: ' + element.value + ' <b onclick="clearOne(\'search\')">×</b></span>';
          return;
        }
        if(element.value) html += '<span class="chip">' + (key === 'sex' ? 'Sex' : key === 'student' ? 'Student' : key === 'member' ? 'Client type' : key === 'status' ? 'Status' : 'Age') + ': ' + element.options[element.selectedIndex].text + ' <b onclick="clearOne(\'' + key + '\')">×</b></span>';
      });
      if(html) html += '<span class="clear" onclick="clearAll()">Clear all</span>';
      html += '<span class="result-count">Showing ' + count + ' of ' + members.length + '</span>';
      document.getElementById('chips').innerHTML = html;
    }

    function render(){
      var list = filtered();
      document.getElementById('tbody').innerHTML = list.map(function(member){
        var st = statusOf(member);
        return '<tr onclick="openDrawer(\'' + member.id + '\', this)">' +
          '<td><div class="m-cell"><div class="m-avatar">' + member.first[0] + member.last[0] + '</div><div><strong>' + member.first + ' ' + member.last + '</strong><span>' + member.id + '</span></div></div></td>' +
          '<td>' + sx(member.sex) + ' · ' + member.age + '</td>' +
          '<td>' + (member.member ? '<span class="tag active" style="background:var(--sky-100);color:var(--blue-700)">Member</span>' : '<span class="tag none">Non-member</span>') + ' ' + (member.student ? '<span class="tag student">Student</span>' : '') + '</td>' +
          '<td><span class="tag ' + st + '">' + statusLabel[st] + '</span></td>' +
          '<td class="muted">' + fmt(member.expiry) + '</td>' +
          '<td class="muted">' + member.contact + '</td>' +
          '</tr>';
      }).join('');

      document.getElementById('empty').style.display = list.length ? 'none' : 'block';
      renderSummary();
      renderChips(list.length);
    }

    function clearOne(key){
      if(key === 'search'){ fieldMap.search.value = ''; }
      else { fieldMap[key].value = ''; }
      render();
    }

    function clearAll(){
      Object.keys(fieldMap).forEach(function(key){
        if(key === 'search') fieldMap.search.value = '';
        else fieldMap[key].value = '';
      });
      render();
    }

    ['search', 'sex', 'student', 'member', 'status', 'age'].forEach(function(key){
      var target = fieldMap[key];
      target.addEventListener(key === 'search' ? 'input' : 'change', render);
    });

    function openDrawer(id, row){
      var member = members.filter(function(item){ return item.id === id; })[0];
      var st = statusOf(member);
      document.querySelectorAll('tbody tr').forEach(function(r){ r.classList.remove('selected'); });
      if(row) row.classList.add('selected');
      document.getElementById('dAvatar').textContent = member.first[0] + member.last[0];
      document.getElementById('dName').textContent = member.first + ' ' + member.last;
      document.getElementById('dId').textContent = member.id;
      document.getElementById('dTags').innerHTML =
        (member.member ? '<span class="tag active" style="background:var(--sky-100);color:var(--blue-700)">Member</span>' : '<span class="tag none">Non-member</span>') +
        (member.student ? '<span class="tag student">Student</span>' : '') +
        '<span class="tag ' + st + '">' + statusLabel[st] + '</span>';
      document.getElementById('dSex').textContent = sx(member.sex);
      document.getElementById('dAge').textContent = member.age;
      document.getElementById('dBirth').textContent = fmt(member.birth);
      document.getElementById('dContact').textContent = member.contact;
      document.getElementById('dEmail').textContent = member.email;
      document.getElementById('dAddress').textContent = member.address;
      document.getElementById('dPlan').textContent = member.plan;
      document.getElementById('dStatus').textContent = statusLabel[st];
      document.getElementById('dStart').textContent = fmt(member.start);
      document.getElementById('dExpiry').textContent = fmt(member.expiry);
      document.getElementById('dLast').textContent = member.last_in;
      document.getElementById('dVisits').textContent = member.visits;
      document.getElementById('dPayments').innerHTML = member.pays.map(function(payment){
        return '<div class="pay-row"><div>' + payment[0] + '<small>' + payment[1] + '</small></div><strong>' + payment[2] + '</strong></div>';
      }).join('');
      document.getElementById('drawer').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }

    function closeDrawer(){
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
      document.querySelectorAll('tbody tr').forEach(function(r){ r.classList.remove('selected'); });
    }

    render();
  </script>
  <script src="/components/theme.js"></script>
</body>
</html>
